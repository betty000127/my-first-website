<div class="app-shell">

<dialog id="editor-dialog" aria-labelledby="editor-title"><div class="editor-top"><div><span class="eyebrow">NEWSLETTER STUDIO</span><h2 id="editor-title">製作電子報</h2></div><button class="icon-button" data-close="editor-dialog" aria-label="關閉編輯器">✕</button></div><div class="editor-layout"><form id="editor-form"><label>電子報名稱<input name="name" maxlength="100" required></label><label>郵件主旨<input name="subject" maxlength="150" required></label><label>預覽文字<input name="preheader" maxlength="180"></label><div class="form-row"><label>版型<select name="template" aria-label="版型"><option value="editorial">品牌月刊</option><option value="product">產品新訊</option><option value="event">活動邀請</option></select></label><label>分類<select name="category" aria-label="分類"><option>品牌動態</option><option>產品更新</option><option>活動邀請</option></select></label></div><label>品牌名稱<input name="brand" maxlength="80" required></label><label>主標題<input name="headline" maxlength="120" required></label><label>內文<textarea name="body" rows="6" maxlength="6000" required></textarea></label><div class="form-row"><label>按鈕文字<input name="cta" maxlength="60"></label><label>按鈕網址<input name="url" type="url" placeholder="https://example.com"></label></div><p class="field-note">草稿僅儲存在此瀏覽器，請勿輸入客戶個資。匯出的 HTML 可交由郵件服務使用，正式上線前仍需跨郵件客戶端測試。</p><div class="editor-actions"><button type="button" class="button secondary" id="export-email">匯出 HTML ↗</button><button type="submit" class="button primary">儲存草稿</button></div><p id="editor-feedback" role="status"></p></form><div class="preview-panel"><div class="preview-toolbar"><span><i class="status-dot"></i> 即時預覽</span><div role="group" aria-label="預覽寬度"><button type="button" class="preview-toggle active" data-width="desktop">桌面</button><button type="button" class="preview-toggle" data-width="mobile">手機</button></div></div><div class="preview-stage"><iframe title="電子報內容預覽" id="email-preview" sandbox=""></iframe></div></div></div></dialog>
<dialog id="info-dialog" aria-labelledby="info-title"><div class="editor-top"><h2 id="info-title"></h2><button class="icon-button" data-close="info-dialog" aria-label="關閉">✕</button></div><div id="info-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
